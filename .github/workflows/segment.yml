name: Session indépendante CPI
on:
  workflow_call:
    inputs:
      number:
        type: number
        required: true
    outputs:
      finished:
        value: ${{ jobs.observe.outputs.finished }}
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      finished: ${{ steps.state.outputs.finished }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restaurer uniquement la mémoire CPI
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: checkpoint
          key: cpi-20261110-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}-final
          restore-keys: cpi-20261110-v1-
      - name: Refuser une nouvelle fenêtre ou une mémoire perdue
        env:
          SEGMENT: ${{ inputs.number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ ! -f checkpoint/cpi.sqlite ]; then
            if [ "$SEGMENT" != "1" ] || [ "$ATTEMPT" != "1" ]; then
              echo 'Mémoire absente : arrêt sans réinitialisation.' >&2
              exit 1
            fi
            if [ -n "$(git ls-remote --heads origin results)" ]; then
              echo 'Une campagne CPI existe déjà : pas de doublon.' >&2
              exit 1
            fi
          fi
      - name: Précontrôle BLS et carnets depuis le cloud
        if: inputs.number == 1
        run: node src/run.mjs --init --boot --minutes 1
      - name: Sauvegarder le précontrôle
        if: inputs.number == 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: checkpoint
          key: cpi-20261110-v1-${{ github.run_id }}-${{ github.run_attempt }}-boot
      - name: Publier la preuve du démarrage
        if: inputs.number == 1
        run: node src/publish-report.mjs
      - name: Attendre puis mesurer la publication sans ordre réel
        run: node src/run.mjs --minutes 270
      - name: Sauvegarder même après une erreur récupérable
        if: always() && hashFiles('checkpoint/cpi.sqlite') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: checkpoint
          key: cpi-20261110-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}-final
      - name: Publier le bilan et les preuves de la session
        if: always() && hashFiles('checkpoint/reports/bilan.json') != ''
        run: |
          node src/publish-report.mjs
          cat checkpoint/reports/bilan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Lire la fin de campagne
        id: state
        if: success()
        run: node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('checkpoint/reports/bilan.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'finished='+(Boolean(r.finished)||Date.now()>=r.manifest.endAt)+'\n');"
      - name: Préparer la sauvegarde finale facultative
        if: steps.state.outputs.finished == 'true' || failure()
        run: |
          if [ -f checkpoint/cpi.sqlite ]; then
            gzip -c checkpoint/cpi.sqlite > checkpoint/cpi.sqlite.gz
          fi
      - name: Export final sans achat de stockage
        if: steps.state.outputs.finished == 'true' || failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cpi-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.number }}
          path: |
            checkpoint/cpi.sqlite.gz
            checkpoint/reports/
            policy.json
            seed.json
          retention-days: 2
          compression-level: 0
